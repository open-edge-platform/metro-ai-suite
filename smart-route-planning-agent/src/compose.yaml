networks:
  routeplanner:
    driver: bridge

services:
  route-planner-agent:
    image: intel/smart-route-planning-agent:${TAG:-latest}
    ports:
      - "${AI_ROUTE_PLANNER_PORT:-7864}:7860"
      - "${INTERSECTIONS_API_PORT:-8765}:8765"
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy:-${NO_PROXY}},${HOST_IP},ovms
      - HTTP_PROXY=${http_proxy}
      - HTTPS_PROXY=${https_proxy}
      - NO_PROXY=${no_proxy:-${NO_PROXY}},${HOST_IP},ovms
      - REASONING_MODEL_NAME=${REASONING_MODEL_NAME:-}  # Optional. When empty, rule based planning is used.
      - REASONING_TIMEOUT_SEC=${REASONING_TIMEOUT_SEC:-120.0}  # Increase for larger models or slower hardware.
      - INTERSECTIONS_API_PORT=8765
    volumes:
      - ./data/config.json:/app/data/config.json:ro
    networks:
      - routeplanner
    depends_on:
      ovms:
        condition: service_healthy
        required: false
      metrics-manager:
        condition: service_started
    healthcheck:
      test: ["CMD", "uv", "run", "health_check.py", "7860"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Provides Intel hardware info (CPU / GPU / NPU) shown at the top of the UI.
  metrics-manager:
    image: intel/metrics-manager:2026.2.0
    privileged: true
    volumes:
      - /sys:/sys
      - /dev:/dev
    networks:
      - routeplanner
    restart: unless-stopped

  ovms:
    image: openvino/model_server:2026.4.0
    profiles:
      - reasoning
    command:
      - --source_model
      - ${REASONING_MODEL_NAME:-}
      - --model_repository_path
      - /home/ovms/models
      - --task
      - text_generation
      - --target_device
      - CPU
      - --rest_port
      - "8000"
      - --rest_bind_address
      - 0.0.0.0
      - --cache_size
      - ${OVMS_CACHE_SIZE:-10}
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy:-${NO_PROXY}},${HOST_IP}
      - HTTP_PROXY=${http_proxy}
      - HTTPS_PROXY=${https_proxy}
      - NO_PROXY=${no_proxy:-${NO_PROXY}},${HOST_IP}
      # Only needed for gated repositories on HuggingFace.
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ovms-models:/home/ovms
    networks:
      - routeplanner
    ulimits:
      nofile:
        soft: 16384
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s    # 10min initial start period to accomodate model download
    restart: unless-stopped

volumes:
  ovms-models:
