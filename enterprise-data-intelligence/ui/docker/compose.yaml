services:
  office-poc-ui:
    image: ${REGISTRY:-opea}/office-poc-ui:${TAG:-latest}
    container_name: office-poc-ui
    environment:
      no_proxy: ${no_proxy:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      UI_PORT: ${UI_PORT:-7000}
      SERVER_HOST: ${SERVER_HOST:-host.docker.internal}
      STATS_API_PORT: ${STATS_API_PORT:-8000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
      VITE_AUTH_TOKEN: ${VITE_AUTH_TOKEN:?VITE_AUTH_TOKEN is required}
      VITE_CHATBOT_WS_PORT: ${VITE_CHATBOT_WS_PORT:-18789}
      VITE_CHATBOT_URL: ${VITE_CHATBOT_URL:-/ws}
    restart: always
    ports:
      - "${UI_PORT:-7000}:${UI_PORT:-7000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
