server {
    listen ${UI_PORT};
    server_name _;

    set $library_server http://${SERVER_HOST}:${LIBRARY_API_PORT};
    set $app_server http://${SERVER_HOST}:${APP_API_PORT};
    set $metrics_server http://${SERVER_HOST}:${METRICS_API_PORT};
    set $workspace_server http://${SERVER_HOST}:${WORKSPACE_API_PORT};


    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 300M;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /library-api/ {
        rewrite ^/library-api/(.*)$ /$1 break;
        proxy_pass $library_server;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    location /app-api/ {
        rewrite ^/app-api/(.*)$ /$1 break;
        proxy_pass $app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }


    location /metrics-api/ {
        rewrite ^/metrics-api/(.*)$ /$1 break;
        proxy_pass $metrics_server;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }


    location /workspace-api/ {
        rewrite ^/workspace-api/(.*)$ /$1 break;
        proxy_pass $workspace_server;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }


    location /ws {
        proxy_pass http://${SERVER_HOST}:${VITE_CHATBOT_WS_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
