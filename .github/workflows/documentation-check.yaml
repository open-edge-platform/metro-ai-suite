# SPDX-License-Identifier: Apache-2.0

name: Documentation Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions: {}

jobs:
  filter:
    permissions:
      contents: read # needed for actions/checkout
    runs-on: ubuntu-latest
    outputs:
      image-based-video-search_changed: ${{ steps.filter.outputs.image-based-video-search }}
      live-video-captioning_changed: ${{ steps.filter.outputs.live-video-captioning }}
      live-video-alert-agent_changed: ${{ steps.filter.outputs.live-video-alert-agent }}
      live-video-search_changed: ${{ steps.filter.outputs.live-video-search }}
      metro-sdk-manager_changed: ${{ steps.filter.outputs.metro-sdk-manager }}
      metro-vision-ai-app-recipe_changed: ${{ steps.filter.outputs.metro-vision-ai-app-recipe }}
      loitering-detection_changed: ${{ steps.filter.outputs.loitering-detection }}
      smart-intersection_changed: ${{ steps.filter.outputs.smart-intersection }}
      smart-parking_changed: ${{ steps.filter.outputs.smart-parking }}
      smart-tolling_changed: ${{ steps.filter.outputs.smart-tolling }}
      sensor-fusion-for-traffic-management_changed: ${{ steps.filter.outputs.sensor-fusion-for-traffic-management }}
      smart-nvr_changed: ${{ steps.filter.outputs.smart-nvr }}
      smart-route-planning-agent_changed: ${{ steps.filter.outputs.smart-route-planning-agent }}
      smart-traffic-intersection-agent_changed: ${{ steps.filter.outputs.smart-traffic-intersection-agent }}
      video-processing-for-nvr_changed: ${{ steps.filter.outputs.video-processing-for-nvr }}
      visual-search-question-and-answering_changed: ${{ steps.filter.outputs.visual-search-question-and-answering }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set paths filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            image-based-video-search:
              - 'image-based-video-search/docs/user-guide/**'
            live-video-captioning:
              - 'live-video-analysis/live-video-captioning/docs/user-guide/**'
            live-video-alert-agent:
              - 'live-video-analysis/live-video-alert-agent/docs/user-guide/**'
            live-video-search:
              - 'live-video-analysis/live-video-search/docs/user-guide/**'
            metro-sdk-manager:
              - 'metro-sdk-manager/docs/user-guide/**'
            metro-vision-ai-app-recipe:
              - 'metro-vision-ai-app-recipe/docs/user-guide/**'
            loitering-detection:
              - 'metro-vision-ai-app-recipe/loitering-detection/docs/user-guide/**'
            smart-intersection:
              - 'metro-vision-ai-app-recipe/smart-intersection/docs/user-guide/**'
            smart-parking:
              - 'metro-vision-ai-app-recipe/smart-parking/docs/user-guide/**'
            smart-tolling:
              - 'metro-vision-ai-app-recipe/smart-tolling/docs/user-guide/**'
            sensor-fusion-for-traffic-management:
              - 'sensor-fusion-for-traffic-management/docs/user-guide/**'
            smart-nvr:
              - 'smart-nvr/docs/user-guide/**'
            smart-route-planning-agent:
              - 'smart-route-planning-agent/docs/user-guide/**'
            smart-traffic-intersection-agent:
              - 'smart-traffic-intersection-agent/docs/user-guide/**'
            video-processing-for-nvr:
              - 'video-processing-for-nvr/docs/user-guide/**'
            visual-search-question-and-answering:
              - 'visual-search-question-and-answering/docs/user-guide/**'

  build-image-based-video-search:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.image-based-video-search_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: image-based-video-search

  build-live-video-captioning:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.live-video-captioning_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: live-video-analysis/live-video-captioning

  build-live-video-alert-agent:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.live-video-alert-agent_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: live-video-analysis/live-video-alert-agent

  build-live-video-search:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.live-video-search_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: live-video-analysis/live-video-search

  build-metro-sdk-manager:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.metro-sdk-manager_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: metro-sdk-manager

  build-metro-vision-ai-app-recipe:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.metro-vision-ai-app-recipe_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: metro-vision-ai-app-recipe

  build-loitering-detection:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.loitering-detection_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: metro-vision-ai-app-recipe/loitering-detection

  build-smart-intersection:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.smart-intersection_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: metro-vision-ai-app-recipe/smart-intersection

  build-smart-parking:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.smart-parking_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: metro-vision-ai-app-recipe/smart-parking

  build-smart-tolling:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.smart-tolling_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: metro-vision-ai-app-recipe/smart-tolling

  build-sensor-fusion-for-traffic-management:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.sensor-fusion-for-traffic-management_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: sensor-fusion-for-traffic-management

  build-smart-nvr:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.smart-nvr_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: smart-nvr

  build-smart-route-planning-agent:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.smart-route-planning-agent_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: smart-route-planning-agent

  build-smart-traffic-intersection-agent:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.smart-traffic-intersection-agent_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: smart-traffic-intersection-agent

  build-video-processing-for-nvr:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.video-processing-for-nvr_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: video-processing-for-nvr
      exclude_patterns: "**/Overview.md"

  build-visual-search-question-and-answering:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.visual-search-question-and-answering_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: visual-search-question-and-answering
