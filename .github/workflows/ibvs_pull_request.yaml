name: "[image-based-video-search] PR workflow"
run-name: "[image-based-video-search] PR  workflow (by @${{ github.actor }} via ${{ github.event_name }})"
on:
  push:
    branches:
      - 'main'
    paths:
      - 'image-based-video-search/**'
  pull_request:
    paths:
      - 'image-based-video-search/**'
  
  workflow_dispatch:    
      
  workflow_call:
permissions: {}

jobs:
  Build-DBS-Trivy:
    name: Build IBVS App and run scans DBS, trivy image fs config
    outputs:
      high_findings: ${{ steps.collect-trivy-high.outputs.has_high }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Check out metro-ai-suites repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
        path: metro-ai-suites-repo
    - name: Build
      run: |
        cd metro-ai-suites-repo/image-based-video-search
        docker compose build --pull --no-cache
        docker compose up -d
        docker ps 
    - name: Checkout docker/docker-bench-security (master)
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        repository: docker/docker-bench-security
        ref: master
        path: docker-bench-security
        persist-credentials: false
    
    - name: Build Docker Bench Security
      run: |
        cd docker-bench-security
        docker build --no-cache -t docker-bench-security .
    - name: DBS download and scan for Wind Turbine Sample App
      run: |
        cd docker-bench-security
        docker run --rm --net host --pid host --userns host --cap-add audit_control \
        -e DOCKER_CONTENT_TRUST=$DOCKER_CONTENT_TRUST \
        -v /etc:/etc:ro \
        -v /usr/bin/containerd:/usr/bin/containerd:ro \
        -v /usr/bin/runc:/usr/bin/runc:ro \
        -v /usr/lib/systemd:/usr/lib/systemd:ro \
        -v /var/lib:/var/lib:ro \
        -v /var/run/docker.sock:/var/run/docker.sock:ro \
        --label docker_bench_security \
        docker-bench-security > dbs_scan_ibvs_app.txt
    - name: Upload DBS Scan artifact to Github
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
      with:
        name: DBS_Scan_Results
        path: docker-bench-security/dbs_scan_*
    - name: Install Trivy from Aqua Security APT repo
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg lsb-release wget apt-transport-https curl jq
        curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y trivy
    - name: Configure Trivy
      continue-on-error: true
      shell: bash
      run: |
        pwd
        cd metro-ai-suites-repo/image-based-video-search/
        trivy --version
        which trivy
        trivy image --download-db-only
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o trivy-html.tpl
        cat << 'EOF' > csv.tpl
        {{ range . }}
        Trivy Vulnerability Scan Results ({{- .Target -}})
        VulnerabilityID,Severity,CVSS Score,Title,Library,Vulnerable Version,Fixed Version,Information URL,Triage Information
        {{ range .Vulnerabilities }}
            {{- .VulnerabilityID }},
            {{- .Severity }},
            {{- range $key, $value := .CVSS }}
                {{- if (eq $key "nvd") }}
                    {{- .V3Score -}}
                {{- end }}
            {{- end }},
            {{- quote .Title }},
            {{- quote .PkgName }},
            {{- quote .InstalledVersion }},
            {{- quote .FixedVersion }},
            {{- .PrimaryURL }}
        {{ else -}}
            No vulnerabilities found at this time.
        {{ end }}
        Trivy Dependency Scan Results ({{ .Target }})
        ID,Name,Version,Notes
        {{ range .Packages -}}
            {{- quote .ID }},
            {{- quote .Name }},
            {{- quote .Version }}
        {{ else -}}
            No dependencies found at this time.
        {{ end }}
        {{ end }}
        EOF
        
    - name: Trivy Image Scans
      run: |
        cd metro-ai-suites-repo/image-based-video-search
        mkdir -p ${{ github.workspace }}/reports/Trivy
        VERSION=$(grep "feature-matching:" compose.yml | awk -F: '{print $3}'| tr -d '[:space:]')
        trivy image intel/feature-matching:$VERSION  -s HIGH,CRITICAL --ignore-unfixed --format template --template "@trivy-html.tpl" -o trivy-image-scan-feature-matching-ignore-unfixed.html
        trivy image intel/feature-matching:$VERSION  -s HIGH,CRITICAL --ignore-unfixed --format template --template "@csv.tpl" -o trivy-image-scan-feature-matching-ignore-unfixed.csv
        trivy image intel/feature-matching:$VERSION -s HIGH,CRITICAL --ignore-unfixed --format json -o trivy-image-scan-feature-matching.json
        trivy image --quiet --format spdx-json --output trivy-image-scan-feature-matching.spdx.json intel/feature-matching:$VERSION 
        VERSION=$(grep "streaming-pipeline:" compose.yml | awk -F: '{print $3}'| tr -d '[:space:]')
        trivy image intel/streaming-pipeline:$VERSION  -s HIGH,CRITICAL --ignore-unfixed --format template --template "@trivy-html.tpl" -o trivy-image-scan-streaming-pipeline-ignore-unfixed.html
        trivy image intel/streaming-pipeline:$VERSION  -s HIGH,CRITICAL --ignore-unfixed --format template --template "@csv.tpl" -o trivy-image-scan-streaming-pipeline-ignore-unfixed.csv
        trivy image intel/streaming-pipeline:$VERSION -s HIGH,CRITICAL --ignore-unfixed --format json -o trivy-image-scan-streaming-pipeline.json
        trivy image --quiet --format spdx-json --output trivy-image-scan-streaming-pipeline.spdx.json intel/streaming-pipeline:$VERSION 
        VERSION=$(grep "image-based-video-search:" compose.yml | awk -F: '{print $3}'| tr -d '[:space:]')
        trivy image intel/image-based-video-search:$VERSION  -s HIGH,CRITICAL --ignore-unfixed --format template --template "@trivy-html.tpl" -o trivy-image-scan-image-based-video-search-ignore-unfixed.html
        trivy image intel/image-based-video-search:$VERSION  -s HIGH,CRITICAL --ignore-unfixed --format template --template "@csv.tpl" -o trivy-image-scan-image-based-video-search-ignore-unfixed.csv
        trivy image intel/image-based-video-search:$VERSION -s HIGH,CRITICAL --ignore-unfixed --format json -o trivy-image-scan-image-based-video-search.json
        trivy image --quiet --format spdx-json --output trivy-image-scan-image-based-video-search.spdx.json intel/image-based-video-search:$VERSION

        mv trivy-image* ${{ github.workspace }}/reports/Trivy

    - name: Trivy Config Scan
      run: |
        cd metro-ai-suites-repo/image-based-video-search
        trivy config . -s HIGH,CRITICAL --format json -o trivy-config.json
    - name: Summarize Trivy config findings
      if: always()
      run: |
        report="metro-ai-suites-repo/image-based-video-search/trivy-config.json"
        table="reports/Trivy/trivy-config.txt"
        mkdir -p reports/Trivy
        echo "## Trivy Config Findings" >> "$GITHUB_STEP_SUMMARY"
        if [ ! -s "$report" ]; then
          echo "Trivy JSON report was not generated." | tee "$table" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        high_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' "$report")
        critical_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL")] | length' "$report")
        {
          echo "| File | Line | Severity | Rule | Finding | Resolution |"
          echo "|------|-----:|----------|------|---------|------------|"
          jq -r '.Results[]? as $result | $result.Misconfigurations[]? | "| \($result.Target | gsub("\\|"; "\\\\|") | gsub("[\\r\\n]+"; " ")) | \(.CauseMetadata.StartLine // "N/A") | \(.Severity) | \(.ID) | \(.Title | gsub("\\|"; "\\\\|") | gsub("[\\r\\n]+"; " ")) | \(.Resolution // "" | gsub("\\|"; "\\\\|") | gsub("[\\r\\n]+"; " ")) |"' "$report"
          if [ "$high_count" -eq 0 ] && [ "$critical_count" -eq 0 ]; then
            echo "| - | - | - | - | No HIGH or CRITICAL findings | - |"
          fi
        } > "$table"
        cat "$table" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "HIGH: $high_count | CRITICAL: $critical_count" >> "$GITHUB_STEP_SUMMARY"
        cp "$report" reports/Trivy/trivy-config.json
    - name: Trivy FS Scan
      run: |
        cd metro-ai-suites-repo/image-based-video-search
        trivy fs .  --format template --template "@trivy-html.tpl" -o "trivy-fs-full-report-code-scan.html" 
        trivy fs --list-all-pkgs --format template --template "@csv.tpl" --output trivy-fs-full-report.csv .
        trivy fs -s HIGH,CRITICAL --ignore-unfixed . | tee trivy-fs-full-report-ignore-unfixed.txt
        trivy fs . -s HIGH,CRITICAL --ignore-unfixed --format json -o trivy-fs-high.json
        mv trivy-fs* ${{ github.workspace }}/reports/Trivy
    - name: Collect Trivy HIGH findings
      id: collect-trivy-high
      if: always()
      run: |
        high_count=0
        for report in reports/Trivy/*.json; do
          [ -s "$report" ] || continue
          report_high=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Misconfigurations[]?) | select(.Severity == "HIGH")] | length' "$report")
          high_count=$((high_count + report_high))
        done
        if [ "$high_count" -gt 0 ]; then
          echo "has_high=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_high=false" >> "$GITHUB_OUTPUT"
        fi
        echo "Trivy HIGH findings: $high_count"
    - name: Upload Trivy Scan Reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
      with:
        name: Trivy-report
        path: reports/Trivy/
  virus-bandit-scan:
    name: Run Bandit Virus Scans
    outputs:
      high_findings: ${{ steps.collect-bandit-high.outputs.has_high }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Check out metro-ai-suites repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        persist-credentials: false
        path: metro-ai-suites-repo

    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run ShellCheck Scan
      run: |
        cd metro-ai-suites-repo/image-based-video-search/
        mkdir -p "$GITHUB_WORKSPACE/reports"
        find . -type f -name "*.sh" -print0 | xargs -0 -r shellcheck -f gcc > "$GITHUB_WORKSPACE/reports/shellcheck-report.txt" || true
        report="$GITHUB_WORKSPACE/reports/shellcheck-report.txt"
        issue_count=$(wc -l < "$report")
        {
          echo "## ShellCheck Findings"
          echo "| File | Line | Column | Severity | Code | Finding |"
          echo "|------|-----:|-------:|----------|------|---------|"
          if [ "$issue_count" -gt 0 ]; then
            while IFS=: read -r file line column diagnostic; do
              severity="${diagnostic# }"
              severity="${severity%%:*}"
              finding="${diagnostic#*: }"
              code="${finding##* \[}"
              code="${code%\]}"
              finding="${finding% \[*}"
              file=$(printf '%s' "$file" | sed 's/|/\\|/g')
              finding=$(printf '%s' "$finding" | sed 's/|/\\|/g')
              printf '| %s | %s | %s | %s | %s | %s |\n' "$file" "$line" "$column" "$severity" "$code" "$finding"
            done < "$report"
          else
            echo "| - | - | - | - | - | No findings |"
          fi
          echo ""
          echo "Findings: $issue_count"
          echo "Full report: shellcheck-report.txt"
        } >> "$GITHUB_STEP_SUMMARY"
        
    - name: Run Virus Scan
      run: |
        mkdir -p reports
        docker pull clamav/clamav
        docker run --rm -v "${{ github.workspace }}:/src" clamav/clamav clamscan -r  /src/metro-ai-suites-repo/image-based-video-search/ > ./reports/clamav-report.txt || true
        infected_count=$(awk '/ FOUND$/ { count++ } END { print count + 0 }' reports/clamav-report.txt)
        {
          echo "### Virus Scan Results"
          echo "| Metric | Count |"
          echo "|--------|------:|"
          echo "| Infected files | $infected_count |"
          echo ""
          if [ "$infected_count" -gt 0 ]; then
            echo "| File | Detection |"
            echo "|------|-----------|"
            awk '/ FOUND$/ { line = $0; sub(/ FOUND$/, "", line); file = line; sub(/: [^:]*$/, "", file); detection = line; sub(/^.*: /, "", detection); printf "| %s | %s |\n", file, detection }' reports/clamav-report.txt
          else
            echo "No infected files found."
          fi
          echo ""
          echo "Full report: clamav-report.txt"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Run Bandit Scan
      run: |
        mkdir -p reports
        docker pull ghcr.io/pycqa/bandit/bandit
        docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/pycqa/bandit/bandit -r /src/metro-ai-suites-repo/image-based-video-search/ -f txt -o /src/reports/bandit-report.txt || true >> $GITHUB_STEP_SUMMARY
        docker run --rm -v "${{ github.workspace }}:/src" ghcr.io/pycqa/bandit/bandit -r /src/metro-ai-suites-repo/image-based-video-search/ -f json -o /src/reports/bandit-report.json || true

    - name: Summarize Bandit findings
      if: always()
      run: |
        report="reports/bandit-report.json"
        echo "## Bandit Scan Findings" >> "$GITHUB_STEP_SUMMARY"
        if [ ! -s "$report" ]; then
          echo "Bandit JSON report was not generated. See bandit-report.txt for scan output." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        high_count=$(jq '[.results[]? | select(.issue_severity == "HIGH")] | length' "$report")
        medium_count=$(jq '[.results[]? | select(.issue_severity == "MEDIUM")] | length' "$report")
        low_count=$(jq '[.results[]? | select(.issue_severity == "LOW")] | length' "$report")
        {
          echo "| Severity | Count |"
          echo "|----------|------:|"
          echo "| HIGH | $high_count |"
          echo "| MEDIUM | $medium_count |"
          echo "| LOW | $low_count |"
          echo ""
          echo "### HIGH Severity Details"
          echo "| File | Line | Severity | Confidence | Test | Finding |"
          echo "|------|-----:|----------|------------|------|---------|"
          jq -r '.results[]? | select(.issue_severity == "HIGH") | [(.filename | gsub("[\\r\\n\\t]+"; " ")), (.line_number | tostring), .issue_severity, .issue_confidence, .test_id, (.issue_text | gsub("[\\r\\n\\t]+"; " "))] | @tsv' "$report" |
          while IFS=$'\t' read -r file line severity confidence test finding; do
            file=$(printf '%s' "$file" | sed 's/|/\\|/g')
            finding=$(printf '%s' "$finding" | sed 's/|/\\|/g')
            printf '| %s | %s | %s | %s | %s | %s |\n' "$file" "$line" "$severity" "$confidence" "$test" "$finding"
          done
          if [ "$high_count" -eq 0 ]; then
            echo "| - | - | - | - | - | No HIGH severity findings |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Full report: bandit-report.txt and bandit-report.json" >> "$GITHUB_STEP_SUMMARY"
    - name: Collect Bandit HIGH findings
      id: collect-bandit-high
      if: always()
      run: |
        report="reports/bandit-report.json"
        high_count=0
        if [ -s "$report" ]; then
          high_count=$(jq '[.results[]? | select(.issue_severity == "HIGH")] | length' "$report")
        fi
        if [ "$high_count" -gt 0 ]; then
          echo "has_high=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_high=false" >> "$GITHUB_OUTPUT"
        fi
        echo "Bandit HIGH findings: $high_count"
    - name: Upload Scan Reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
      with:
        name: virus-bandit-report
        path: reports/
    - name: Clean up
      if: always()
      run: |
        if [ -n "$(docker images -aq)" ]; then
               docker rmi -f $(docker images -aq) || true
        fi

  comment-high-findings:
    name: Comment on HIGH findings
    runs-on: ubuntu-latest
    needs: [Build-DBS-Trivy, virus-bandit-scan]
    if: always() && github.event_name == 'pull_request' && (needs.Build-DBS-Trivy.outputs.high_findings == 'true' || needs.virus-bandit-scan.outputs.high_findings == 'true')
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Create or update HIGH findings comment
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_HIGH: ${{ needs.Build-DBS-Trivy.outputs.high_findings }}
          BANDIT_HIGH: ${{ needs.virus-bandit-scan.outputs.high_findings }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- ibvs-high-security-findings -->"
          body="$marker"$'\n\n'"## HIGH severity security findings"$'\n'"HIGH-severity findings were detected. Review the scan job(s) below:"
          if [ "$TRIVY_HIGH" = "true" ]; then
            trivy_job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "Build IBVS App and run scans DBS, trivy image fs config") | .html_url' | head -n 1)
            body+=$'\n'"| Trivy image/config/filesystem scan | [Open job]($trivy_job) |"
          fi
          if [ "$BANDIT_HIGH" = "true" ]; then
            bandit_job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "Run Bandit Virus Scans") | .html_url' | head -n 1)
            body+=$'\n'"| Bandit scan | [Open job]($bandit_job) |"
          fi
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- ibvs-high-security-findings -->"))) | .id' | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --method PATCH --field body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST --field body="$body" > /dev/null
          fi