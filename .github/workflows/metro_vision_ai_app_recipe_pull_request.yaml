name: "[metro-vision-ai-app-recipe] PR workflow"
run-name: "[metro-vision-ai-app-recipe] PR  workflow (by @${{ github.actor }} via ${{ github.event_name }})"
on:
  push:
    paths:
      - 'metro-vision-ai-app-recipe/**'
  pull_request:
    paths:
      - 'metro-vision-ai-app-recipe/**'
  workflow_dispatch:
  workflow_call:
permissions: {}
jobs:
  virus-scan:
    name: Run Virus Scan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Check out metro-vision-ai-app-recipe repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false
          
      - name: Run Virus Scan
        run: |
          mkdir -p reports
          docker pull clamav/clamav
          docker run --rm -v "${{ github.workspace }}:/src" clamav/clamav clamscan -r /src/metro-vision-ai-app-recipe/ > reports/clamav-report.txt || true
          infected_count=$(awk '/ FOUND$/ { count++ } END { print count + 0 }' reports/clamav-report.txt)
          {
            echo "### Virus Scan Results"
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| Infected files | $infected_count |"
            echo ""
            if [ "$infected_count" -gt 0 ]; then
              echo "| File | Detection |"
              echo "|------|-----------|"
              awk '/ FOUND$/ { line = $0; sub(/ FOUND$/, "", line); file = line; sub(/: [^:]*$/, "", file); detection = line; sub(/^.*: /, "", detection); printf "| %s | %s |\n", file, detection }' reports/clamav-report.txt
            else
              echo "No infected files found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Scan Reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: virus-report
          path: reports/

  shellcheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out metro-ai-suite repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          path: metro-ai-suite-repo

      - name: Install ShellCheck
        run:  sudo apt-get update &&  sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          cd metro-ai-suite-repo/metro-vision-ai-app-recipe/
          echo "Scanning for .sh files and running ShellCheck..."
          find . -type f -name "*.sh" | tee shell_files.txt | xargs -r shellcheck -S error -f gcc > shellcheck_report.txt || scan_status=$?
          issue_count=$(wc -l < shellcheck_report.txt)
          {
            echo "### ShellCheck Results"
            echo "| File | Line | Column | Severity | Code | Finding |"
            echo "|------|-----:|-------:|----------|------|---------|"
            if [ "$issue_count" -gt 0 ]; then
              while IFS=: read -r file line column diagnostic; do
                severity="${diagnostic# }"
                severity="${severity%%:*}"
                finding="${diagnostic#*: }"
                code="${finding##* \[}"
                code="${code%\]}"
                finding="${finding% \[*}"
                file=$(printf '%s' "$file" | sed 's/|/\\|/g')
                finding=$(printf '%s' "$finding" | sed 's/|/\\|/g')
                printf '| %s | %s | %s | %s | %s | %s |\n' "$file" "$line" "$column" "$severity" "$code" "$finding"
              done < shellcheck_report.txt
            else
              echo "| - | - | - | - | - | No errors found |"
            fi
            echo ""
            echo "Error-level findings: $issue_count"
            echo "Full report: shellcheck_report.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          cp shellcheck_report.txt ${{ github.workspace }}
          exit "${scan_status:-0}"

      - name: Upload ShellCheck report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shellcheck-report
          path: shellcheck_report.txt

  trivy-config-helm-scan:
    outputs:
      high_findings: ${{ steps.collect-trivy-high.outputs.has_high }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out metro-ai-suites repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install Trivy from Aqua Security APT repo
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg lsb-release wget apt-transport-https curl jq
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Package Smart Intersection chart for Trivy
        run: |
          mkdir -p /tmp/trivy-chart/smart-intersection
          cp -a metro-vision-ai-app-recipe/smart-intersection/chart/. /tmp/trivy-chart/smart-intersection/
          tar -czf /tmp/trivy-smart-intersection-1.20.0.tgz -C /tmp/trivy-chart smart-intersection

      - name: Trivy config scan
        run: |
          project_status=0
          chart_status=0

          trivy config \
            --skip-version-check \
            --skip-dirs metro-vision-ai-app-recipe/smart-intersection/chart \
            --helm-set-string supass=trivy-scan-placeholder,pgpass=trivy-scan-placeholder \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output trivy-project-report.json \
            metro-vision-ai-app-recipe || project_status=$?

          trivy config \
            --skip-version-check \
            --helm-set-string supass=trivy-scan-placeholder,pgpass=trivy-scan-placeholder \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output trivy-smart-intersection-report.json \
            /tmp/trivy-smart-intersection-1.20.0.tgz || chart_status=$?

          jq -s '.[0] as $project | .[1] as $chart | $project | .Results = (($project.Results // []) + ($chart.Results // []))' \
            trivy-project-report.json trivy-smart-intersection-report.json > trivy-config-report.json

          scan_status=$project_status
          if [ "$chart_status" -gt "$scan_status" ]; then
            scan_status=$chart_status
          fi
          exit "$scan_status"
      - name: Summarize Trivy config findings
        if: always()
        run: |
          report="trivy-config-report.json"
          table="trivy-config-report.txt"
          echo "## Trivy Configuration Findings" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$report" ]; then
            echo "Trivy JSON report was not generated." | tee "$table" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          high_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' "$report")
          critical_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL")] | length' "$report")
          {
            echo "| File | Line | Severity | Rule | Finding | Resolution |"
            echo "|------|-----:|----------|------|---------|------------|"
            jq -r '.Results[]? as $result | $result.Misconfigurations[]? | "| \($result.Target | gsub("\\|"; "\\|") | gsub("[\\r\\n]+"; " ")) | \(.CauseMetadata.StartLine // "N/A") | \(.Severity) | \(.ID) | \(.PrimaryCause // "N/A") | \(.Resolution // "N/A") |"' "$report"
            if [ "$high_count" -eq 0 ] && [ "$critical_count" -eq 0 ]; then
              echo "| - | - | - | - | No HIGH or CRITICAL findings | - |"
            fi
          } > "$table"
          cat "$table" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HIGH: $high_count | CRITICAL: $critical_count" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect Trivy HIGH findings
        id: collect-trivy-high
        if: always()
        run: |
          high_count=0
          if [ -s trivy-config-report.json ]; then
            high_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' trivy-config-report.json)
          fi
          if [ "$high_count" -gt 0 ]; then
            echo "has_high=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_high=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: trivy-config-report
          path: |
            trivy-config-report.json
            trivy-config-report.txt

  bandit:
    name: Bandit
    outputs:
      high_findings: ${{ steps.collect-bandit-high.outputs.has_high }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install Bandit
        run: |
          python3 -m venv bandit_venv
          bandit_venv/bin/pip install bandit==1.8.6
      - name: Run Bandit
        id: run-bandit
        run: |
          bandit_exit=0
          bandit_venv/bin/bandit -r metro-vision-ai-app-recipe \
            -x metro-vision-ai-app-recipe/test-suite,metro-vision-ai-app-recipe/smart-intersection/tests \
            -f json -o bandit-report.json || bandit_exit=$?
          echo "exit_code=$bandit_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarize Bandit findings
        if: always()
        run: |
          echo "## Bandit Scan Results" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f bandit-report.json ]; then
            echo "Bandit report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          jq -r '"| Severity | Findings |\n|----------|----------|\n| HIGH | \([.results[] | select(.issue_severity == "HIGH")] | length) |\n| MEDIUM | \([.results[] | select(.issue_severity == "MEDIUM")] | length) |\n| LOW | \([.results[] | select(.issue_severity == "LOW")] | length) |"' bandit-report.json >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.results | length > 0' bandit-report.json > /dev/null; then
            echo "Bandit found security issues; see the uploaded report for details." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce Bandit result
        if: always()
        run: |
          case "${{ steps.run-bandit.outputs.exit_code }}" in
            0) exit 0 ;;
            1)
              high_count=$(jq -r '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json)
              if [ "$high_count" -gt 0 ]; then
                echo "::error title=Bandit Findings::Bandit found $high_count HIGH severity issue(s). See bandit-report.json for details."
                exit 1
              fi
              ;;
            *)
              echo "::error title=Bandit Execution Failed::Bandit exited with code ${{ steps.run-bandit.outputs.exit_code }}."
              exit "${{ steps.run-bandit.outputs.exit_code }}"
              ;;
          esac
      - name: Collect Bandit HIGH findings
        id: collect-bandit-high
        if: always()
        run: |
          high_count=0
          if [ -s bandit-report.json ]; then
            high_count=$(jq '[.results[]? | select(.issue_severity == "HIGH")] | length' bandit-report.json)
          fi
          if [ "$high_count" -gt 0 ]; then
            echo "has_high=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_high=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: bandit-report
          path: bandit-report.json

  sanity:
    name: Sanity Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'
      - name: Install Robot Framework
        run: pip3 install robotframework selenium PyYAML requests pynose
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils vlc
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Robot sanity tests
        run: |
          cd metro-vision-ai-app-recipe/test-suite/robot_files
          robot test.robot || true
          mkdir -p /tmp/test_results
          cp -r report.html log.html output.xml /tmp/test_results/
          summary_file=/tmp/validation-summary.md
          {
            echo "## Metro Vision AI App Recipe Sanity Test Summary"
            echo "| Test | Total | Passed | Failed | Not Run |"
            echo "|------|------:|-------:|-------:|--------:|"
            passed=$(xmllint --xpath "count(//test/status[@status='PASS'])" output.xml 2>/dev/null || echo 0)
            failed=$(xmllint --xpath "count(//test/status[@status='FAIL'])" output.xml 2>/dev/null || echo 0)
            not_run=$(xmllint --xpath "count(//test/status[@status='NOT RUN'])" output.xml 2>/dev/null || echo 0)
            total=$((passed + failed + not_run))
            echo "| Robot | $total | $passed | $failed | $not_run |"
          } > "$summary_file"
          echo "" >> "$summary_file"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Sanity reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: sanity-reports
          path: /tmp/test_results/*

  verify-scan-status:
    name: Verify Scan Status
    runs-on: ubuntu-24.04
    if: always()
    needs: [virus-scan, shellcheck, bandit, trivy-config-helm-scan, sanity]
    steps:
      - name: Generate scan status
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          names=("virus-scan" "shellcheck" "bandit" "trivy-config-helm-scan" "sanity")
          statuses=("${{ needs.virus-scan.result }}" "${{ needs.shellcheck.result }}" "${{ needs.bandit.result }}" "${{ needs.trivy-config-helm-scan.result }}" "${{ needs.sanity.result }}")
          passed=0
          failed=0
          skipped=0
          failed_names=()
          {
            echo "## Security Scan Summary"
            echo "| Scan Job | Status |"
            echo "|----------|--------|"
            for index in "${!names[@]}"; do
              case "${statuses[index]}" in
                success) label="Passed"; passed=$((passed + 1)) ;;
                failure) label="Failed"; failed=$((failed + 1)); failed_names+=("${names[index]}") ;;
                skipped|cancelled) label="${statuses[index]}"; skipped=$((skipped + 1)) ;;
                *) label="Unknown" ;;
              esac
              echo "| ${names[index]} | $label |"
            done
            echo ""
            echo "Passed: $passed | Failed: $failed | Skipped/Cancelled: $skipped"
            echo ""
            echo "### Trigger Information"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Event | $EVENT_NAME |"
            echo "| Branch | $REF_NAME |"
            echo "| Commit | [$COMMIT_SHA](https://github.com/$REPOSITORY/commit/$COMMIT_SHA) |"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "| PR | [#$PR_NUMBER]($PR_URL) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            echo "::error title=Security Scan Failed::Failed jobs: ${failed_names[*]}"
            exit 1
          fi

  comment-high-findings:
    name: Comment on HIGH findings
    runs-on: ubuntu-24.04
    needs: [bandit, trivy-config-helm-scan]
    if: always() && github.event_name == 'pull_request' && (needs.bandit.outputs.high_findings == 'true' || needs.trivy-config-helm-scan.outputs.high_findings == 'true')
    permissions:
      actions: read
      pull-requests: write
      contents: read
    steps:
      - name: Create or update HIGH findings comment
        env:
          GH_TOKEN: ${{ github.token }}
          BANDIT_HIGH: ${{ needs.bandit.outputs.high_findings }}
          TRIVY_HIGH: ${{ needs.trivy-config-helm-scan.outputs.high_findings }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- metro-vision-high-security-findings -->"
          body="$marker"$'\n\n'"## HIGH severity security findings"$'\n'"HIGH-severity findings were detected. Review the scan job(s) below:"
          if [ "$BANDIT_HIGH" = "true" ]; then
            bandit_job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "Bandit") | .html_url' | head -n 1)
            bandit_job=${bandit_job:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}
            body+=$'\n'"| Bandit scan | [Open job]($bandit_job) |"
          fi
          if [ "$TRIVY_HIGH" = "true" ]; then
            trivy_job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name | contains("trivy-config-helm-scan")) | .html_url' | head -n 1)
            trivy_job=${trivy_job:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}
            body+=$'\n'"| Trivy config scan | [Open job]($trivy_job) |"
          fi
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- metro-vision-high-security-findings -->"))) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --method PATCH --field body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST --field body="$body" > /dev/null
          fi