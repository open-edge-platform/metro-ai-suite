name: "[metro-vision-ai-app-recipe] PR workflow"
run-name: "[metro-vision-ai-app-recipe] PR  workflow (by @${{ github.actor }} via ${{ github.event_name }})"
on:
  push:
    paths:
      - 'metro-vision-ai-app-recipe/**'
  pull_request:
    paths:
      - 'metro-vision-ai-app-recipe/**'
  workflow_dispatch:
  workflow_call:
permissions: {}
jobs:
  changed-files:
    name: Get Changed Files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      files: ${{ steps.changed.outputs.files }}
      shellcheck_files: ${{ steps.changed.outputs.shellcheck_files }}
      bandit_files: ${{ steps.changed.outputs.bandit_files }}
      trivy_config_files: ${{ steps.changed.outputs.trivy_config_files }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Calculate changed recipe files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" -- metro-vision-ai-app-recipe | jq -Rsc 'split("\u0000")[:-1]')
          else
            files=$(git ls-files -z metro-vision-ai-app-recipe | jq -Rsc 'split("\u0000")[:-1]')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "shellcheck_files=$(jq -c '[.[] | select(endswith(".sh"))]' <<< "$files")" >> "$GITHUB_OUTPUT"
          echo "bandit_files=$(jq -c '[.[] | select(endswith(".py") and (startswith("metro-vision-ai-app-recipe/test-suite/") | not) and (startswith("metro-vision-ai-app-recipe/smart-intersection/tests/") | not))]' <<< "$files")" >> "$GITHUB_OUTPUT"
          echo "trivy_config_files=$(jq -c '[.[] | select(endswith(".yaml") or endswith(".yml") or endswith(".json") or endswith(".tf") or endswith(".tfvars") or endswith(".hcl") or test("(^|/)Dockerfile(\\..*)?$"))]' <<< "$files")" >> "$GITHUB_OUTPUT"

  virus-scan:
    name: Run Virus Scan
    runs-on: ubuntu-24.04
    needs: changed-files
    env:
      CHANGED_FILES: ${{ needs.changed-files.outputs.files }}
    strategy:
      fail-fast: false
    steps:
      - name: Check out metro-vision-ai-app-recipe repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false
          
      - name: Run Virus Scan
        run: |
          mkdir -p reports
          files=()
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              files+=("/src/$file")
            fi
          done < <(jq -j '.[] | . + "\u0000"' <<< "$CHANGED_FILES")
          : > reports/clamav-report.txt
          infected_count=0
          if [ "${#files[@]}" -gt 0 ]; then
            docker pull clamav/clamav
            docker run --rm -v "$GITHUB_WORKSPACE:/src" clamav/clamav clamscan "${files[@]}" > reports/clamav-report.txt || true
            infected_count=$(awk '/ FOUND$/ { count++ } END { print count + 0 }' reports/clamav-report.txt)
          fi
          {
            echo "### Virus Scan Results"
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| Infected files | $infected_count |"
            echo ""
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No supporting file changes; virus scan passed without running."
            elif [ "$infected_count" -gt 0 ]; then
              echo "| File | Detection |"
              echo "|------|-----------|"
              awk '/ FOUND$/ { line = $0; sub(/ FOUND$/, "", line); file = line; sub(/: [^:]*$/, "", file); detection = line; sub(/^.*: /, "", detection); printf "| %s | %s |\n", file, detection }' reports/clamav-report.txt
            else
              echo "No infected files found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Scan Reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: virus-report
          path: reports/

  shellcheck:
    runs-on: ubuntu-24.04
    needs: changed-files
    env:
      SHELLCHECK_FILES: ${{ needs.changed-files.outputs.shellcheck_files }}

    steps:
      - name: Check out metro-ai-suite repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          path: metro-ai-suite-repo

      - name: Install ShellCheck
        run:  sudo apt-get update &&  sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          cd metro-ai-suite-repo
          echo "Scanning changed .sh files and running ShellCheck..."
          shell_files=()
          scan_status=0
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then shell_files+=("$file"); fi
          done < <(jq -j '.[] | . + "\u0000"' <<< "$SHELLCHECK_FILES")
          : > shellcheck_report.txt
          if [ "${#shell_files[@]}" -gt 0 ]; then
            shellcheck -S error -f gcc "${shell_files[@]}" > shellcheck_report.txt || scan_status=$?
          fi
          issue_count=$(wc -l < shellcheck_report.txt)
          {
            echo "### ShellCheck Results"
            echo "| File | Line | Column | Severity | Code | Finding |"
            echo "|------|-----:|-------:|----------|------|---------|"
            if [ "${#shell_files[@]}" -eq 0 ]; then
              echo "No supporting file changes; ShellCheck passed without running."
            elif [ "$issue_count" -gt 0 ]; then
              while IFS=: read -r file line column diagnostic; do
                severity="${diagnostic# }"
                severity="${severity%%:*}"
                finding="${diagnostic#*: }"
                code="${finding##* \[}"
                code="${code%\]}"
                finding="${finding% \[*}"
                file=$(printf '%s' "$file" | sed 's/|/\\|/g')
                finding=$(printf '%s' "$finding" | sed 's/|/\\|/g')
                printf '| %s | %s | %s | %s | %s | %s |\n' "$file" "$line" "$column" "$severity" "$code" "$finding"
              done < shellcheck_report.txt
            else
              echo "| - | - | - | - | - | No errors found |"
            fi
            echo ""
            echo "Error-level findings: $issue_count"
            echo "Full report: shellcheck_report.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          cp shellcheck_report.txt "$GITHUB_WORKSPACE"
          exit "${scan_status:-0}"

      - name: Upload ShellCheck report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shellcheck-report
          path: shellcheck_report.txt

  trivy-config-scan:
    outputs:
      high_findings: ${{ steps.collect-trivy-high.outputs.has_high }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    needs: changed-files
    env:
      TRIVY_CONFIG_FILES: ${{ needs.changed-files.outputs.trivy_config_files }}
    steps:
      - name: Check out metro-ai-suites repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Install Trivy from Aqua Security APT repo
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg lsb-release wget apt-transport-https curl jq
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy config scan
        run: |
          config_files=()
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then config_files+=("$file"); fi
          done < <(jq -j '.[] | . + "\u0000"' <<< "$TRIVY_CONFIG_FILES")
          reports=()
          scan_status=0
          for index in "${!config_files[@]}"; do
            report="trivy-config-report-$index.json"
            reports+=("$report")
            trivy config \
              --skip-version-check \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format json \
              --output "$report" \
              "${config_files[index]}" || scan_status=$?
          done
          if [ "${#reports[@]}" -gt 0 ]; then
            jq -s '{Results: [.[].Results[]?]}' "${reports[@]}" > trivy-config-report.json
          else
            printf '{"Results":[]}\n' > trivy-config-report.json
          fi
          exit "$scan_status"
      - name: Summarize Trivy config findings
        if: always()
        run: |
          report="trivy-config-report.json"
          table="trivy-config-report.txt"
          echo "## Trivy Configuration Findings" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$report" ]; then
            echo "Trivy JSON report was not generated." | tee "$table" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$(jq 'length' <<< "$TRIVY_CONFIG_FILES")" -eq 0 ]; then
            echo "No supporting file changes; Trivy config scan passed without running." | tee "$table" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          high_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' "$report")
          critical_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL")] | length' "$report")
          {
            echo "| File | Line | Severity | Rule | Finding | Resolution |"
            echo "|------|-----:|----------|------|---------|------------|"
            jq -r '.Results[]? as $result | $result.Misconfigurations[]? | "| \($result.Target | gsub("\\|"; "\\|") | gsub("[\\r\\n]+"; " ")) | \(.CauseMetadata.StartLine // "N/A") | \(.Severity) | \(.ID) | \(.PrimaryCause // "N/A") | \(.Resolution // "N/A") |"' "$report"
            if [ "$high_count" -eq 0 ] && [ "$critical_count" -eq 0 ]; then
              echo "| - | - | - | - | No HIGH or CRITICAL findings | - |"
            fi
          } > "$table"
          cat "$table" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HIGH: $high_count | CRITICAL: $critical_count" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect Trivy HIGH findings
        id: collect-trivy-high
        if: always()
        run: |
          high_count=0
          if [ -s trivy-config-report.json ]; then
            high_count=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' trivy-config-report.json)
          fi
          if [ "$high_count" -gt 0 ]; then
            echo "has_high=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_high=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: trivy-config-report
          path: |
            trivy-config-report.json
            trivy-config-report.txt

  bandit:
    name: Bandit
    outputs:
      high_findings: ${{ steps.collect-bandit-high.outputs.has_high }}
    runs-on: ubuntu-24.04
    needs: changed-files
    env:
      BANDIT_FILES: ${{ needs.changed-files.outputs.bandit_files }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install Bandit
        run: |
          python3 -m venv bandit_venv
          bandit_venv/bin/pip install bandit==1.8.6
      - name: Run Bandit
        id: run-bandit
        run: |
          bandit_exit=0
          python_files=()
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then python_files+=("$file"); fi
          done < <(jq -j '.[] | . + "\u0000"' <<< "$BANDIT_FILES")
          if [ "${#python_files[@]}" -gt 0 ]; then
            bandit_venv/bin/bandit "${python_files[@]}" -f json -o bandit-report.json || bandit_exit=$?
          else
            printf '{"results":[]}\n' > bandit-report.json
          fi
          echo "exit_code=$bandit_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarize Bandit findings
        if: always()
        run: |
          echo "## Bandit Scan Results" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f bandit-report.json ]; then
            echo "Bandit report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$(jq 'length' <<< "$BANDIT_FILES")" -eq 0 ]; then
            echo "No supporting file changes; Bandit scan passed without running." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '"| Severity | Findings |\n|----------|----------|\n| HIGH | \([.results[] | select(.issue_severity == "HIGH")] | length) |\n| MEDIUM | \([.results[] | select(.issue_severity == "MEDIUM")] | length) |\n| LOW | \([.results[] | select(.issue_severity == "LOW")] | length) |"' bandit-report.json >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.results | length > 0' bandit-report.json > /dev/null; then
            echo "Bandit found security issues; see the uploaded report for details." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce Bandit result
        if: always()
        run: |
          case "${{ steps.run-bandit.outputs.exit_code }}" in
            0) exit 0 ;;
            1)
              high_count=$(jq -r '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json)
              if [ "$high_count" -gt 0 ]; then
                echo "::error title=Bandit Findings::Bandit found $high_count HIGH severity issue(s). See bandit-report.json for details."
                exit 1
              fi
              ;;
            *)
              echo "::error title=Bandit Execution Failed::Bandit exited with code ${{ steps.run-bandit.outputs.exit_code }}."
              exit "${{ steps.run-bandit.outputs.exit_code }}"
              ;;
          esac
      - name: Collect Bandit HIGH findings
        id: collect-bandit-high
        if: always()
        run: |
          high_count=0
          if [ -s bandit-report.json ]; then
            high_count=$(jq '[.results[]? | select(.issue_severity == "HIGH")] | length' bandit-report.json)
          fi
          if [ "$high_count" -gt 0 ]; then
            echo "has_high=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_high=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: bandit-report
          path: bandit-report.json

  sanity:
    name: Sanity Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'
      - name: Install Robot Framework
        run: pip3 install robotframework selenium PyYAML requests pynose
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils vlc
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Robot sanity tests
        run: |
          cd metro-vision-ai-app-recipe/test-suite/robot_files
          robot test.robot || true
          mkdir -p /tmp/test_results
          cp -r report.html log.html output.xml /tmp/test_results/
          summary_file=/tmp/validation-summary.md
          {
            echo "## Metro Vision AI App Recipe Sanity Test Summary"
            echo "| Test | Total | Passed | Failed | Not Run |"
            echo "|------|------:|-------:|-------:|--------:|"
            passed=$(xmllint --xpath "count(//test/status[@status='PASS'])" output.xml 2>/dev/null || echo 0)
            failed=$(xmllint --xpath "count(//test/status[@status='FAIL'])" output.xml 2>/dev/null || echo 0)
            not_run=$(xmllint --xpath "count(//test/status[@status='NOT RUN'])" output.xml 2>/dev/null || echo 0)
            total=$((passed + failed + not_run))
            echo "| Robot | $total | $passed | $failed | $not_run |"
          } > "$summary_file"
          echo "" >> "$summary_file"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Sanity reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: sanity-reports
          path: /tmp/test_results/*

  verify-scan-status:
    name: Verify Scan Status
    runs-on: ubuntu-24.04
    if: always()
    needs: [changed-files, virus-scan, shellcheck, bandit, trivy-config-scan, sanity]
    steps:
      - name: Generate scan status
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          names=("changed-files" "virus-scan" "shellcheck" "bandit" "trivy-config-scan" "sanity")
          statuses=("${{ needs.changed-files.result }}" "${{ needs.virus-scan.result }}" "${{ needs.shellcheck.result }}" "${{ needs.bandit.result }}" "${{ needs.trivy-config-scan.result }}" "${{ needs.sanity.result }}")
          passed=0
          failed=0
          skipped=0
          failed_names=()
          {
            echo "## Security Scan Summary"
            echo "| Scan Job | Status |"
            echo "|----------|--------|"
            for index in "${!names[@]}"; do
              case "${statuses[index]}" in
                success) label="Passed"; passed=$((passed + 1)) ;;
                failure) label="Failed"; failed=$((failed + 1)); failed_names+=("${names[index]}") ;;
                skipped|cancelled) label="${statuses[index]}"; skipped=$((skipped + 1)) ;;
                *) label="Unknown" ;;
              esac
              echo "| ${names[index]} | $label |"
            done
            echo ""
            echo "Passed: $passed | Failed: $failed | Skipped/Cancelled: $skipped"
            echo ""
            echo "### Trigger Information"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Event | $EVENT_NAME |"
            echo "| Branch | $REF_NAME |"
            echo "| Commit | [$COMMIT_SHA](https://github.com/$REPOSITORY/commit/$COMMIT_SHA) |"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "| PR | [#$PR_NUMBER]($PR_URL) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            echo "::error title=Security Scan Failed::Failed jobs: ${failed_names[*]}"
            exit 1
          fi
