# SkillSpector baseline — findings listed here are suppressed on future scans.
# Edit 'reason' fields and add glob 'rules' as needed. See docs/SUPPRESSION.md.
#
# Glob 'rules' are used (not exact 'fingerprints') so suppression stays valid
# across scanner versions and future edits to the referenced docs.
version: 2
rules:
  - id: "RP1"
    path: "*SKILL.md"
    reason: "Reviewed: resolve the newest stable compatible image tags from their
      registries at stack-generation time, verify compatibility, and pin the
      concrete selected tags in generated files. Never use :latest."
  - id: "RP1"
    path: "*INSTALL.md"
    reason: "Reviewed: image tags in references/INSTALL.md are resolved to the
      newest stable compatible release at stack-generation time, then replaced
      with concrete verified tags in generated files. Never use :latest."
fingerprints: []
