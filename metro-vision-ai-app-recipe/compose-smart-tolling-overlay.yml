#
# Smart Tolling deltas on top of compose-scenescape.yml (the shared Scenescape base).
# Merge with: docker compose -f compose-scenescape.yml -f compose-smart-tolling-overlay.yml config
#
# List-valued keys below (volumes) are intentionally appended to, not replaced: the base's
# compose-scenescape.yml volume entries that don't apply to smart-tolling (e.g. the
# "models/intersection" mount) resolve to a harmless empty bind-mounted directory that nothing
# in this app's pipelines reference, so overriding the full list (and duplicating the base's
# entries here, risking drift) was judged not worth it.

services:
  smart-tolling-image-server:
    image: nginx:1.30.2-alpine
    container_name: smart-tolling-image-server
    ports:
      - "8081:80"
    volumes:
      - smart_tolling_images:/images_data:ro
      - ./${SAMPLE_APP}/src/nginx/smart-tolling-image-server.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - scenescape
    restart: on-failure:5

  node-red:
    volumes:
      - smart_tolling_images:/images_data

  influxdb2:
    environment:
      DOCKER_INFLUXDB_INIT_BUCKET: smart-toll-bucket

  grafana:
    volumes:
      - ./${SAMPLE_APP}/src/grafana/data/dashboards/Overview.json:/tmp/Overview.json
      - ./${SAMPLE_APP}/src/grafana/data/dashboards/Vehicle_Events_Axle_Analysis.json:/tmp/Vehicle_Events_Axle_Analysis.json
    entrypoint: [
        "/bin/bash",
        "-e",
        "-c",
        "mkdir -p /var/lib/grafana/dashboards && \
        cp /tmp/Overview.json /var/lib/grafana/dashboards/Overview.json && \
        cp /tmp/Vehicle_Events_Axle_Analysis.json /var/lib/grafana/dashboards/Vehicle_Events_Axle_Analysis.json && \
        mkdir -p /etc/grafana/provisioning/dashboards && \
        cp /tmp/dashboards.yml /etc/grafana/provisioning/dashboards/main.yml && \
        mkdir -p /etc/grafana/provisioning/datasources && \
        cp /tmp/datasources.yml /etc/grafana/provisioning/datasources/datasources.yml && \
        sed -i \"s/<influx-api-token>/$(cat /run/secrets/influxdb2-admin-token)/g\" /etc/grafana/provisioning/datasources/datasources.yml && \
        /run.sh",
      ]

  dlstreamer-pipeline-server:
    volumes:
      - ./${SAMPLE_APP}/src/dlstreamer-pipeline-server/models/axle:/home/pipeline-server/models/axle
      - ./${SAMPLE_APP}/src/dlstreamer-pipeline-server/models/vehicle_type:/home/pipeline-server/models/vehicle_type
      - ./${SAMPLE_APP}/src/dlstreamer-pipeline-server/models/vehicle_front_rear:/home/pipeline-server/models/vehicle_front_rear
      - ./${SAMPLE_APP}/src/dlstreamer-pipeline-server/models/color_int8_latest:/home/pipeline-server/models/color_int8_latest
      - ./${SAMPLE_APP}/src/dlstreamer-pipeline-server/models/licenseplate_cropped:/home/pipeline-server/models/licenseplate_cropped
      - ./${SAMPLE_APP}/src/dlstreamer-pipeline-server/models/paddle_ocr_v4:/home/pipeline-server/models/paddle_ocr_v4

  web:
    environment:
      - EXAMPLEDB=/home/scenescape/Scenescape/smart-tolling.tar.bz2
    volumes:
      - ./${SAMPLE_APP}/src/webserver/smart-tolling.tar.bz2:/home/scenescape/Scenescape/smart-tolling.tar.bz2

volumes:
  smart_tolling_images:
