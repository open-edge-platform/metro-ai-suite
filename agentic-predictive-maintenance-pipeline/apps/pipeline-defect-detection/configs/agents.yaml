use_case_id: pipeline-defect-detection

# Agent configuration for pipeline defect detection
analysis:
  min_confidence: 0.25
  max_detections_per_run: 500

policy:
  # Labels emitted by the DL Streamer model
  defect_classes:
    - gas-pipelines
    - deformation
    - corrosion
    - coating degradation
    - deformations
  # Demonstration review thresholds, not calibrated asset-severity estimates.
  alert_threshold: 0.7
  critical_classes: []
  priority_thresholds:
    low:
      min_avg_confidence: 0.7
      classes:
        - gas-pipelines
        - deformation
        - corrosion
        - coating degradation
        - deformations

evidence:
  retention_frames: 1000    # keep evidence for last N frames
